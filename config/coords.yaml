# [변경사유]: 2026-08-17 실측 — 방 창 424×1032, 서랍 1144×838
# 측정: 카톡 방 창 / 서랍 창을 목표 크기로 둔 뒤, 클릭 지점의 client 좌표를 기입.
# 실패 시 해당 회차 중단 — 절대 화면 좌표 금지.
# 수집 때도 이 창 크기를 유지할 것 (크기가 바뀌면 좌표가 어긋남).

# 방 창 크기 참고값 (「강남 라틴클럽」 실측)
room_client_size: [424, 1032]

# 1) 방 창 — ☰ (채팅방 메뉴)  client_offset=[402, 60]
hamburger: [402, 60]

# ☰ 이후 서랍/사진: 방 창이 좁아서 메뉴 좌표는 쓰지 않음 → 키보드
# Down×drawer_menu_downs → Right → Down×photos_menu_downs → Enter
drawer_menu: [620, 120]
photos_submenu: [780, 140]
drawer_menu_downs: 2
photos_menu_downs: 0
use_menu_coords: false

# 서랍 창 ("채팅방 서랍") 크기 참고
drawer_client_size: [1144, 838]

# 2) 서랍 — 첫 사진 앵커
first_photo: [345, 332]

# 3) 서랍 — 다운로드 버튼 (재측정 [1108, 810] 근처)
download: [1108, 810]

# 선택·프리로드
select_count: 50
preload_arrow_presses: 80
# right | down | right_then_down
arrow_mode: right_then_down
grid_columns: 6
